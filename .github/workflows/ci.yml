name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checagem de tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Verificação das regras fiscais
        run: npm run check:rules
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
